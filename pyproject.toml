[project]
name = "servicecore"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pypdf>=5.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "anthropic>=2.12.0",
    "playwright>=1.48",
    "weasyprint>=62.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
servicecore = "servicecore.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
